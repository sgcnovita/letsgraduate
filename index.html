<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auto-Marking Questionnaire</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .progress {
            margin-bottom: 25px;
            color: #666;
            font-size: 15px;
        }

        .question {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            font-size: 17px;
            border: 2px solid #ddd;
            border-radius: 10px;
            resize: vertical;
            outline: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        textarea:focus {
            border-color: #555;
        }

        button {
            margin-top: 18px;
            padding: 13px 28px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f7f7f7;
        }

        .question-score {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .word-results {
            line-height: 2;
        }

        .correct {
            color: #16803c;
            font-weight: bold;
            margin-right: 8px;
        }

        .incorrect {
            color: #d62828;
            font-weight: bold;
            margin-right: 8px;
        }

        .missing {
            color: #d62828;
            font-weight: bold;
            margin-right: 8px;
        }

        .extra {
            color: #b36b00;
            font-weight: bold;
            margin-right: 8px;
        }

        .final-result {
            text-align: center;
        }

        .final-score {
            font-size: 38px;
            font-weight: bold;
            margin: 20px 0;
        }

        .percentage {
            font-size: 25px;
            margin-bottom: 25px;
        }

        .hidden {
            display: none;
        }

        .instructions {
            background: #f1f1f1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
            }

            .card {
                padding: 22px;
            }

            .question {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Auto-Marking Questionnaire</h1>

        <p class="subtitle">
            Type your answer and submit it for automatic marking.
        </p>

        <div class="instructions">
            <strong>Marking rules:</strong><br>
            • Capitalisation is ignored.<br>
            • Punctuation is ignored.<br>
            • Extra spaces are ignored.<br>
            • Each correct word receives one mark.
        </div>

        <!-- QUIZ -->
        <div id="quiz">

            <div class="progress" id="progress"></div>

            <div class="question" id="questionText"></div>

            <textarea
                id="answerInput"
                placeholder="Type your answer here..."
            ></textarea>

            <button id="submitButton" onclick="submitAnswer()">
                Submit Answer
            </button>

            <div id="result"></div>

        </div>


        <!-- FINAL RESULT -->
        <div id="finalResult" class="final-result hidden">

            <h2>Quiz Complete!</h2>

            <div class="final-score" id="finalScore"></div>

            <div class="percentage" id="finalPercentage"></div>

            <button onclick="restartQuiz()">
                Try Again
            </button>

        </div>

    </div>

</div>


<script>

    /*
    ==================================================
    QUESTIONS
    ==================================================

    CHANGE THESE QUESTIONS AND ANSWERS TO YOUR OWN.

    The "answer" is the correct answer used for marking.
    ==================================================
    */

    const questions = [

        {
            question: "What is the capital city of Australia?",
            answer: "Canberra"
        },

        {
            question: "What does AI stand for?",
            answer: "Artificial Intelligence"
        },

        {
            question: "What is machine learning?",
            answer: "Machine learning is a type of artificial intelligence that allows computers to learn from data"
        },

        {
            question: "What is algorithmic bias?",
            answer: "Algorithmic bias occurs when an algorithm produces systematically unfair outcomes"
        },

        {
            question: "What is cybersecurity?",
            answer: "Cybersecurity is the practice of protecting systems networks and programs from digital attacks"
        }

    ];


    /*
    ==================================================
    VARIABLES
    ==================================================
    */

    let currentQuestion = 0;

    let totalScore = 0;

    let totalPossibleMarks = 0;


    /*
    ==================================================
    NORMALISE TEXT
    ==================================================

    This function:

    1. Converts text to lowercase.
    2. Removes punctuation.
    3. Converts multiple spaces into one space.
    4. Removes spaces at the beginning and end.
    ==================================================
    */

    function normalizeText(text) {

        return text
            .toLowerCase()

            // Remove punctuation
            .replace(/[.,!?;:'"()[\]{}\-_/\\]/g, " ")

            // Convert multiple spaces to one
            .replace(/\s+/g, " ")

            // Remove beginning/end spaces
            .trim();
    }


    /*
    ==================================================
    SHOW QUESTION
    ==================================================
    */

    function showQuestion() {

        if (currentQuestion >= questions.length) {

            showFinalResult();

            return;
        }

        document.getElementById("progress").innerText =
            "Question " +
            (currentQuestion + 1) +
            " of " +
            questions.length;


        document.getElementById("questionText").innerText =
            questions[currentQuestion].question;


        document.getElementById("answerInput").value = "";

        document.getElementById("result").innerHTML = "";

        document.getElementById("submitButton").innerText =
            "Submit Answer";
    }


    /*
    ==================================================
    SUBMIT ANSWER
    ==================================================
    */

    function submitAnswer() {

        const correctAnswer =
            normalizeText(
                questions[currentQuestion].answer
            );


        const studentAnswer =
            normalizeText(
                document.getElementById("answerInput").value
            );


        /*
        Convert answers into arrays of words.
        */

        const correctWords =
            correctAnswer === ""
                ? []
                : correctAnswer.split(" ");


        const studentWords =
            studentAnswer === ""
                ? []
                : studentAnswer.split(" ");


        /*
        The maximum mark is the number
        of words in the correct answer.
        */

        const maximumMark = correctWords.length;


        let score = 0;


        let resultHTML =
            "<div class='result'>";


        resultHTML +=
            "<div class='question-score'>" +
            "Question Score: 0/" +
            maximumMark +
            "</div>";


        resultHTML +=
            "<div class='word-results'>";


        /*
        ==================================================
        WORD-BY-WORD COMPARISON
        ==================================================
        */

        for (let i = 0; i < correctWords.length; i++) {

            const correctWord =
                correctWords[i];

            const studentWord =
                studentWords[i];


            /*
            Correct word
            */

            if (studentWord === correctWord) {

                score++;

                resultHTML +=
                    "<span class='correct'>" +
                    correctWord +
                    " ✓</span>";

            }

            /*
            Missing or incorrect word
            */

            else {

                resultHTML +=
                    "<span class='incorrect'>" +
                    correctWord +
                    " ✗</span>";

            }

        }


        /*
        ==================================================
        EXTRA WORDS
        ==================================================
        */

        if (studentWords.length > correctWords.length) {

            resultHTML +=
                "<br><br><strong>Extra words:</strong><br>";

            for (
                let i = correctWords.length;
                i < studentWords.length;
                i++
            ) {

                resultHTML +=
                    "<span class='extra'>" +
                    studentWords[i] +
                    " +</span>";

            }

        }


        /*
        Calculate percentage.
        */

        let percentage = 0;

        if (maximumMark > 0) {

            percentage =
                (score / maximumMark) * 100;

        }


        /*
        Display score.
        */

        resultHTML += "</div>";


        resultHTML +=
            "<div class='question-score'>" +
            "Score: " +
            score +
            "/" +
            maximumMark +
            " (" +
            percentage.toFixed(1) +
            "%)" +
            "</div>";


        resultHTML += "</div>";


        document.getElementById("result").innerHTML =
            resultHTML;


        /*
        Add score to overall score.
        */

        totalScore += score;

        totalPossibleMarks += maximumMark;


        /*
        Change button to Next Question.
        */

        const button =
            document.getElementById("submitButton");


        button.innerText =
            currentQuestion === questions.length - 1
                ? "Finish Quiz"
                : "Next Question";


        button.onclick =
            nextQuestion;

    }


    /*
    ==================================================
    NEXT QUESTION
    ==================================================
    */

    function nextQuestion() {

        currentQuestion++;

        showQuestion();

    }


    /*
    ==================================================
    FINAL RESULT
    ==================================================
    */

    function showFinalResult() {

        document.getElementById("quiz")
            .classList.add("hidden");


        document.getElementById("finalResult")
            .classList.remove("hidden");


        const percentage =
            totalPossibleMarks > 0
                ? (totalScore / totalPossibleMarks) * 100
                : 0;


        document.getElementById("finalScore").innerText =
            totalScore +
            " / " +
            totalPossibleMarks;


        document.getElementById("finalPercentage").innerText =
            "Overall Score: " +
            percentage.toFixed(1) +
            "%";

    }


    /*
    ==================================================
    RESTART QUIZ
    ==================================================
    */

    function restartQuiz() {

        currentQuestion = 0;

        totalScore = 0;

        totalPossibleMarks = 0;


        document.getElementById("quiz")
            .classList.remove("hidden");


        document.getElementById("finalResult")
            .classList.add("hidden");


        showQuestion();

    }


    /*
    ==================================================
    START QUESTIONNAIRE
    ==================================================
    */

    showQuestion();

</script>

</body>
</html>
